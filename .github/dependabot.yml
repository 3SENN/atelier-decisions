version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The runner's versions are Atelier's (onnxruntime-node and @huggingface/tokenizers ship inside it): a bump here
  # is measured with runtime/node/src/parity.ts and lands in Atelier together.
  - package-ecosystem: npm
    directory: /runtime/node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

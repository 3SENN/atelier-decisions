name: Bug report
description: Something in the code, the runner or the tools doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the existing issues first.
        A model answering wrong is a "Wrong decision" issue; security problems go through private reporting
        (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands, with their arguments.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: "main at 568c2ff, or v0.5"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, Python or Node version, and the GPU if it ran on one.
      placeholder: "Windows 11, Python 3.12, RTX 3060 12 GB"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
